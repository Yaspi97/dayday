<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ma DAY DAY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&display=swap">
<style>
/* Layout: one centered night-sky stage, hearts drifting up on a canvas behind the words. Single deliberate dark theme. */
:root {
  --night: #1a0a1f;
  --plum: #3b1240;
  --rose: #ff5c8a;
  --blush: #ffc2d4;
  --cream: #fff3f6;
  --script: "Parisienne", "Snell Roundhand", "Brush Script MT", cursive;
  --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--plum) 0%, var(--night) 70%);
  background-color: var(--night);
  color: var(--cream);
  overflow: hidden;
  font-family: var(--serif);
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  user-select: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.stage {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.4rem;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  box-sizing: border-box;
  pointer-events: none;
}
.big-heart {
  width: clamp(64px, 14vw, 110px);
  filter: drop-shadow(0 0 24px rgba(255, 92, 138, 0.65));
  animation: beat 1.3s ease-in-out infinite;
}
.love {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(4rem, 17vw, 10rem);
  line-height: 1;
  margin: 0.2em 0 0;
  color: var(--blush);
  text-shadow: 0 0 30px rgba(255, 92, 138, 0.55), 0 0 2px var(--cream);
  text-wrap: balance;
}
.name {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(1.4rem, 6vw, 3rem);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin: 0;
  padding-left: 0.32em;
  color: var(--cream);
}
.name em { font-style: italic; font-weight: 400; letter-spacing: 0.05em; text-transform: none; color: var(--rose); }
.hint {
  margin-top: 2.2rem;
  font-style: italic;
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  color: var(--blush);
  opacity: 0.7;
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.14); }
  30% { transform: scale(1); }
  45% { transform: scale(1.09); }
}
@media (prefers-reduced-motion: reduce) { .big-heart { animation: none; } }
</style>

<canvas id="sky"></canvas>
<main class="stage">
  <svg class="big-heart" viewBox="0 0 100 90" aria-hidden="true">
    <path fill="#ff5c8a" d="M50 88 C20 66 2 48 2 28 C2 13 13 2 27 2 C37 2 45 8 50 16 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 48 80 66 50 88Z"/>
  </svg>
  <h1 class="love">Je t'aime</h1>
  <p class="name"><em>ma</em> DAY DAY</p>
  <p class="hint">touche l'écran ♥</p>
</main>

<script>
(() => {
  const c = document.getElementById('sky');
  const ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#ff5c8a', '#ffc2d4', '#ff8fb0', '#fff3f6', '#e83e6c'];
  let W, H, dpr, hearts = [];

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.closePath();
  }

  function spawn(x, y, burst) {
    const s = burst ? 10 + Math.random() * 22 : 8 + Math.random() * 26;
    const ang = Math.random() * Math.PI * 2;
    const sp = burst ? 2 + Math.random() * 5 : 0;
    hearts.push({
      x: x ?? Math.random() * W,
      y: y ?? H + 30,
      s,
      vx: burst ? Math.cos(ang) * sp : (Math.random() - 0.5) * 0.4,
      vy: burst ? Math.sin(ang) * sp - 2 : -(0.5 + Math.random() * 1.2),
      a: burst ? 1 : 0.25 + Math.random() * 0.55,
      fade: burst ? 0.012 + Math.random() * 0.01 : 0,
      wob: Math.random() * Math.PI * 2,
      col: colors[(Math.random() * colors.length) | 0]
    });
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (hearts.length < 60 && Math.random() < 0.25) spawn();
    hearts = hearts.filter(h => h.a > 0 && h.y > -60);
    for (const h of hearts) {
      h.wob += 0.03;
      h.x += h.vx + Math.sin(h.wob) * 0.3;
      h.y += h.vy;
      if (h.fade) { h.vy += 0.04; h.vx *= 0.98; h.a -= h.fade; }
      ctx.globalAlpha = Math.max(h.a, 0);
      ctx.fillStyle = h.col;
      ctx.shadowColor = h.col;
      ctx.shadowBlur = 12;
      heartPath(h.x, h.y, h.s);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointerdown', e => { for (let i = 0; i < 26; i++) spawn(e.clientX, e.clientY, true); });
  resize();
  if (!reduce) {
    for (let i = 0; i < 25; i++) spawn(undefined, Math.random() * H);
    frame();
  }
})();
</script>

</body></html>
